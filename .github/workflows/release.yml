name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux Build Dependencies
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config
          elif command -v pacman >/dev/null 2>&1; then
            sudo pacman -Sy --noconfirm gtk3 webkit2gtk-4.1 base-devel pkgconf
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y gtk3-devel webkit2gtk4.1-devel gcc pkgconfig
          elif command -v zypper >/dev/null 2>&1; then
            sudo zypper install -y gtk3-devel webkit2gtk3-devel gcc pkg-config
          elif command -v apk >/dev/null 2>&1; then
            sudo apk add gtk+3.0-dev webkit2gtk-dev build-base pkgconf
          else
            echo "Unknown package manager. Please ensure GTK3, WebKit2GTK-4.1, and pkg-config are installed."
          fi


      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Package Release
        run: ./scripts/package-release.sh

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/netconnect-linux-amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
